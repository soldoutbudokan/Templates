name: Counting trainer checks

on:
  pull_request:
    paths:
      - 'Counting/**'
      - '.github/workflows/counting-checks.yml'
  push:
    branches: [master]
    paths:
      - 'Counting/**'
      - '.github/workflows/counting-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Counting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Counting/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
